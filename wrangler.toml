name = "poetry-garden-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "poetry-garden-v2"
database_id = "1a4cc052-a792-4d54-ab1e-32a6632f2a87"

[[r2_buckets]]
binding = "CONTENT"
bucket_name = "poetry-garden-content"

# /api/insights/generate calls MiniMax M2.1 highspeed via the OpenAI-
# compatible chat completions endpoint at api.minimaxi.com. The API
# key is stored as a Worker secret via `wrangler secret put MINIMAX_API_KEY`
# — the [vars] placeholders below are intentionally invalid so the
# worker fails closed if the secret is missing in production.
[vars]
API_VERSION = "1.0.0"
MINIMAX_BASE_URL = "https://api.minimaxi.com/v1"
MINIMAX_MODEL = "MiniMax-M2.1-highspeed"
# JWT_SECRET is set per-environment via `wrangler secret put JWT_SECRET`.
# This placeholder is intentionally invalid so the worker fails closed if
# the secret is missing in production.
JWT_SECRET = "dev-override-only-set-secret-in-prod"
